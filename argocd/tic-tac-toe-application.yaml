apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tic-tac-toe
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Mallikarjun-Atanoor/tic-tac-toe-microservices-application.git
    targetRevision: argocd
    path: apps/tic-tac-toe
    
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: tic-tac-toe

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true